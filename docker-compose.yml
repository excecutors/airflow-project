services:
  db:
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: "airflow"
      POSTGRES_PASSWORD: "airflow"
      POSTGRES_DB: "airflow"
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.2
    container_name: airflow-init
    entrypoint: ["/bin/bash","-c"]
    command: >
      airflow db init &&
      airflow users create --username admin --password admin --firstname Air --lastname Flow --role Admin --email admin@example.com
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@db:5432/airflow"
    depends_on:
      - db

  airflow-webserver:
    image: apache/airflow:2.9.2
    container_name: airflow-web
    command: webserver
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@db:5432/airflow"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      _PIP_ADDITIONAL_REQUIREMENTS: "Faker==37.12.0 apache-airflow-providers-postgres pandas matplotlib psycopg2-binary"
      AIRFLOW_CONN_POSTGRES: "postgresql+psycopg2://airflow:airflow@db:5432/airflow"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.9.2
    container_name: airflow-scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:airflow@db:5432/airflow"
      _PIP_ADDITIONAL_REQUIREMENTS: "Faker==37.12.0 apache-airflow-providers-postgres pandas matplotlib psycopg2-binary"
      AIRFLOW_CONN_POSTGRES: "postgresql+psycopg2://airflow:airflow@db:5432/airflow"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-webserver

volumes:
  pg_data: